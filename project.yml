name: CarplayMaps
options:
  bundleIdPrefix: com.djsly
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: QGMAWHX827
    MARKETING_VERSION: 1.0.3
    CURRENT_PROJECT_VERSION: 1
targets:
  CarplayMaps:
    type: application
    platform: iOS
    sources:
      - path: CarplayMaps
    dependencies:
      - target: MapsWidget
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.djsly.carplaymaps
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: 1
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SUPPORTS_XR_DESIGNED_FOR: NO
    info:
      path: CarplayMaps/Resources/Info.plist
      properties:
        CFBundleName: carplaymaps
        CFBundleDisplayName: carplaymaps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Your position drives the map, routing, and ETA.
        NSSupportsLiveActivities: true
  MapsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MapsWidget
      - path: CarplayMaps/Shared
    info:
      path: MapsWidget/Info.plist
      properties:
        CFBundleName: MapsWidget
        CFBundleDisplayName: carplaymaps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djsly.carplaymaps.widgets
        SKIP_INSTALL: true
schemes:
  CarplayMaps:
    build:
      targets:
        CarplayMaps: all
    run:
      config: Debug
